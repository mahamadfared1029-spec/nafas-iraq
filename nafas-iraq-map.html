<!doctype html>
<html lang="ar-IQ" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>خريطة العراق | نَفَس</title>
<style>
:root{color-scheme:light;--ink:#222238;--walnut:#4A3324;--orchid:#62467D;--cream:#F7F1E7}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.6 Tahoma,Arial,sans-serif}
main{width:min(1180px,100% - 28px);margin:28px auto}header{display:flex;align-items:baseline;gap:15px;margin-bottom:14px}
header b{color:var(--orchid);font-size:1.3rem}h1{margin:0;font-size:clamp(25px,5vw,38px);line-height:1.25}h2{font-size:19px;margin:0}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(270px,320px);gap:14px}
.map{position:relative;background:#DFD5C0;border:2px solid #C4B59F;border-radius:16px;overflow:hidden;min-width:0;box-shadow:0 4px 16px rgba(34,34,56,0.08)}
svg{display:block;width:100%;height:min(72vh,690px);min-height:335px;touch-action:pan-y}
.province{fill:#D4BEA2;stroke:#3E2C1E;stroke-width:1.6;stroke-linejoin:round;vector-effect:non-scaling-stroke;fill-rule:evenodd;cursor:pointer;transition:fill .18s ease,stroke .18s ease}
.province:nth-child(5n+1){fill:#C8A882}
.province:nth-child(5n+2){fill:#D6BD9F}
.province:nth-child(5n+3){fill:#BFA07A}
.province:nth-child(5n+4){fill:#CEB896}
.province:nth-child(5n){fill:#C49A76}
.province:hover,.province:focus-visible{fill:#7D4E96;stroke:#181424;outline:none;stroke-width:2.4}
.province.selected{fill:#62467D;stroke:#181424;outline:none;stroke-width:2.8}
.river{fill:none;stroke:#17527D;stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.euphrates{stroke-dasharray:8 4}
.map-tools{position:absolute;top:10px;left:10px;display:grid;gap:6px}
button,select{font:inherit;border:1px solid #4A3324;border-radius:8px;background:#FFFCF5;color:var(--ink);padding:6px 10px;min-height:38px}
button{cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--orchid);outline-offset:2px}
button:disabled{opacity:.55;cursor:default}
aside{background:#FFFCF5;border:1px solid #C4B59F;border-radius:14px;padding:15px;align-self:start;box-shadow:0 2px 10px rgba(34,34,56,0.05)}
aside label.control{display:grid;gap:4px;margin:10px 0}select{width:100%;min-width:0}
.legend{margin:12px 0;display:flex;flex-wrap:wrap;gap:8px;font-size:.87rem}.legend span{white-space:nowrap}
.key{display:inline-block;width:18px;border-top:3.5px solid #17527D;margin-inline-end:4px;vertical-align:middle}
.key.dash{border-top-style:dashed}
.marker circle{stroke:#ffffff;stroke-width:2}
.marker{cursor:pointer;filter:drop-shadow(0 2px 4px rgba(0,0,0,0.3))}
.marker text{fill:white;font:bold 11px Arial;pointer-events:none}
.marker:focus-visible circle{stroke:var(--ink);stroke-width:3.2}
#note{margin:9px 0;overflow-wrap:anywhere}#reports{padding-inline-start:20px;margin:0}#reports li{margin:5px 0}
footer{font-size:13px;color:var(--walnut);margin-top:12px}a{color:var(--orchid)}[hidden]{display:none!important}
@media(max-width:720px){main{margin:16px auto}.layout{grid-template-columns:1fr}header{flex-wrap:wrap;gap:6px}svg{height:52vh}}
</style></head>

    const x=projection.x0+(record.lng-projection.minLng)*projection.sx;
    const y=projection.y0+(projection.maxLat-record.lat)*projection.sy;
    const point=new DOMPoint(x,y);
    const location=[...places].reverse().find(p=>{
      const elem=byId.get(p.id)?.path;
      return (elem && typeof elem.isPointInFill==="function") ? elem.isPointInFill(point) : false;
    }) || places.find(p=>p.id===record.province);
    if(!location) continue;
    entries.push({...record,province:location.id,x,y});
    accepted.add(record.id);
  }
  drawReports();
  return entries.length;
}
