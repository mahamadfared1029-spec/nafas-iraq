<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>أوركيد ثلاثية الأبعاد — الخارج، الداخل، والعمليات الداخلية</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    :root {
      --bg-top: #f9f3f6;
      --bg-mid: #f1e4eb;
      --bg-bot: #e3d0da;
      --ink-primary: #24141f;
      --ink-muted: #8a6d7e;
      --accent: #7a1647;
      --glass-bg: rgba(255, 250, 252, 0.74);
      --glass-border: rgba(122, 22, 71, 0.16);
      --glass-shadow: 0 18px 45px rgba(40, 12, 28, 0.1);
      --btn-bg: #24141f;
      --btn-ink: #fff9fb;
    }

    body.dark-studio {
      --bg-top: #140912;
      --bg-mid: #0e060e;
      --bg-bot: #050206;
      --ink-primary: #fdf4f8;
      --ink-muted: #9b7d8f;
      --accent: #e068a4;
      --glass-bg: rgba(22, 12, 22, 0.76);
      --glass-border: rgba(240, 180, 212, 0.2);
      --glass-shadow: 0 22px 55px rgba(0, 0, 0, 0.55);
      --btn-bg: #f6dce9;
      --btn-ink: #1b0f18;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: auto;
    }

    body {
      font-family: 'Segoe UI', Tahoma, system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 55% 38%, var(--bg-top) 0%, var(--bg-mid) 54%, var(--bg-bot) 100%);
      color: var(--ink-primary);
      overflow-x: hidden;
      transition: background 0.7s ease;
      min-height: 100vh;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      pointer-events: auto;
      cursor: grab;
      touch-action: pan-y;
    }

    #canvas-container.free-orbit {
      touch-action: none;
    }

    #canvas-container.dragging {
      cursor: grabbing;
    }

    #canvas-container canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .studio-vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(circle at 50% 48%, transparent 48%, rgba(36, 12, 26, 0.11) 100%);
      transition: background 0.7s ease;
    }

    body.dark-studio .studio-vignette {
      background: radial-gradient(circle at 50% 48%, transparent 40%, rgba(0, 0, 0, 0.68) 100%);
    }

    /* Top Segmented View Switcher (Exterior | Interior | Internal Processes) */
    .view-switcher {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 35;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--glass-shadow);
      max-width: calc(100vw - 20px);
    }

    .view-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 36px;
      padding: 6px 15px;
      border-radius: 999px;
      border: none;
      background: transparent;
      color: var(--ink-primary);
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.28s ease, color 0.28s ease, transform 0.2s ease;
    }

    .view-btn:hover {
      background: rgba(122, 22, 71, 0.09);
    }

    .view-btn.active {
      background: var(--btn-bg);
      color: var(--btn-ink);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.16);
    }

    .view-btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* Subtle Process Legend Pills (Shown ONLY in Internal Processes Mode) */
    .process-legend {
      position: fixed;
      top: 72px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
      max-width: calc(100vw - 24px);
      flex-wrap: wrap;
      justify-content: center;
    }

    .process-legend.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--ink-primary);
      white-space: nowrap;
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Minimal Side Progress Dots */
    .progress-rail {
      position: fixed;
      inset-inline-end: 22px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 25;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 11px;
      pointer-events: auto;
      transition: opacity 0.35s ease;
    }

    .progress-rail.dimmed {
      opacity: 0.25;
    }

    .chapter-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      border: 1.5px solid var(--ink-muted);
      background: transparent;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      padding: 0;
    }

    .chapter-dot.active {
      height: 28px;
      background: var(--accent);
      border-color: var(--accent);
    }

    /* Clean Text-Free Scroll Track */
    .scroll-track {
      position: relative;
      z-index: 5;
      pointer-events: none;
    }

    .chapter {
      height: 105vh;
    }

    /* Minimal Icon-Only Floating Dock */
    .studio-dock {
      position: fixed;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 35;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 13px;
      border-radius: 999px;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: var(--glass-shadow);
      max-width: calc(100vw - 24px);
    }

    .dock-group {
      display: flex;
      align-items: center;
      gap: 7px;
      flex-shrink: 0;
    }

    .dock-divider {
      width: 1px;
      height: 20px;
      background: var(--glass-border);
      flex-shrink: 0;
    }

    .swatch-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), border-color 0.25s ease;
      flex-shrink: 0;
    }

    .swatch-btn:hover {
      transform: scale(1.14);
    }

    .swatch-btn.active {
      border-color: var(--ink-primary);
      transform: scale(1.14);
    }

    .bloom-slider {
      width: 88px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: transparent;
      color: var(--ink-primary);
      cursor: pointer;
      transition: transform 0.25s ease, background 0.25s ease, border-color 0.25s ease;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      transform: translateY(-1px);
      border-color: var(--accent);
    }

    .icon-btn.active {
      background: var(--btn-bg);
      color: var(--btn-ink);
      border-color: transparent;
    }

    .icon-btn svg {
      width: 16px;
      height: 16px;
    }

    @media (max-width: 768px) {
      .view-switcher {
        top: 12px;
        padding: 4px;
      }
      .view-btn {
        padding: 6px 11px;
        font-size: 0.76rem;
      }
      .process-legend {
        top: 62px;
        gap: 8px;
        padding: 5px 10px;
      }
      .progress-rail {
        inset-inline-end: 10px;
      }
      .studio-dock {
        bottom: 12px;
        padding: 7px 10px;
        gap: 7px;
      }
      .bloom-slider {
        width: 64px;
      }
    }
  </style>
</head>
<body>
  <div id="canvas-container" aria-label="مشهد ثلاثي الأبعاد لزهرة الأوركيد وأنسجتها والعمليات الداخلية"></div>
  <div class="studio-vignette"></div>

  <!-- 3-Mode Segmented View Switcher: Exterior | Interior | Internal Processes -->
  <div class="view-switcher" role="tablist" aria-label="وضع استكشاف الزهرة">
    <button id="view-exterior" class="view-btn active" role="tab" aria-selected="true" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a4 4 0 0 1 4 4c0 2-1.5 3.5-4 6-2.5-2.5-4-4-4-6a4 4 0 0 1 4-4Z"></path>
        <path d="M12 12c2.5-2.5 4-4 6-4a4 4 0 0 1 0 8c-2 0-3.5-1.5-6-4Z"></path>
        <path d="M12 12c-2.5-2.5-4-4-6-4a4 4 0 0 0 0 8c2 0 3.5-1.5 6-4Z"></path>
        <circle cx="12" cy="12" r="2"></circle>
      </svg>
      <span>الخارج</span>
    </button>
    <button id="view-interior" class="view-btn" role="tab" aria-selected="false" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        <line x1="11" y1="8" x2="11" y2="14"></line>
        <line x1="8" y1="11" x2="14" y2="11"></line>
      </svg>
      <span>الداخل</span>
    </button>
    <button id="view-processes" class="view-btn" role="tab" aria-selected="false" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
      </svg>
      <span>العمليات الداخلية</span>
    </button>
  </div>

  <!-- Compact Color Legend (Only Visible During Internal Processes Mode) -->
  <div id="process-legend" class="process-legend" aria-hidden="true">
    <span class="legend-item"><span class="legend-dot" style="background:#38f2c8;box-shadow:0 0 8px #38f2c8;"></span>تدفق النسغ والماء</span>
    <span class="legend-item"><span class="legend-dot" style="background:#ffcf4d;box-shadow:0 0 8px #ffcf4d;"></span>إفراز الرحيق واللقاح</span>
    <span class="legend-item"><span class="legend-dot" style="background:#ff5ea8;box-shadow:0 0 8px #ff5ea8;"></span>نبض الأوعية الخلوية</span>
  </div>

  <!-- 5-Stage Progress Dots -->
  <nav id="progress-rail" class="progress-rail" aria-label="مراحل التفتح والاستكشاف">
    <button class="chapter-dot active" data-target="ch-1" aria-label="المرحلة 1"></button>
    <button class="chapter-dot" data-target="ch-2" aria-label="المرحلة 2"></button>
    <button class="chapter-dot" data-target="ch-3" aria-label="المرحلة 3: الأنسجة المجهرية"></button>
    <button class="chapter-dot" data-target="ch-4" aria-label="المرحلة 4: داخل قلب الزهرة"></button>
    <button class="chapter-dot" data-target="ch-5" aria-label="المرحلة 5"></button>
  </nav>

  <!-- Clean Text-Free Scroll Track -->
  <main class="scroll-track" aria-hidden="true">
    <section id="ch-1" class="chapter"></section>
    <section id="ch-2" class="chapter"></section>
    <section id="ch-3" class="chapter"></section>
    <section id="ch-4" class="chapter"></section>
    <section id="ch-5" class="chapter"></section>
  </main>

  <!-- Minimal Icon-Only Floating Studio Dock -->
  <div class="studio-dock" role="toolbar" aria-label="أدوات التحكم بالزهرة">
    <div class="dock-group" aria-label="ألوان الأوركيد">
      <button class="swatch-btn active" data-variety="obsidian" title="خمري مخملي داكن" aria-label="أوركيد خمري مخملي داكن" style="background: linear-gradient(135deg, #6b0f3b, #2b0419, #0e0109);"></button>
      <button class="swatch-btn" data-variety="royal" title="بنفسجي ملكي داكن" aria-label="أوركيد بنفسجي ملكي داكن" style="background: linear-gradient(135deg, #b8338a, #690e4c, #24021a);"></button>
      <button class="swatch-btn" data-variety="blush" title="وردي مخملي" aria-label="أوركيد وردي مخملي" style="background: linear-gradient(135deg, #f9d4e3, #c85b8e, #66103b);"></button>
      <button class="swatch-btn" data-variety="ivory" title="أبيض ملكي" aria-label="أوركيد أبيض ملكي" style="background: linear-gradient(135deg, #ffffff, #f2e4ea, #c98614);"></button>
    </div>

    <div class="dock-divider"></div>

    <input id="bloom-slider" class="bloom-slider" type="range" min="0" max="100" value="46" aria-label="درجة التفتّح" title="درجة التفتّح" />

    <div class="dock-divider"></div>

    <button id="macro-toggle" class="icon-btn" type="button" aria-label="الدخول لرؤية الأنسجة المجهرية" title="الدخول للداخل">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        <line x1="11" y1="8" x2="11" y2="14"></line>
        <line x1="8" y1="11" x2="14" y2="11"></line>
      </svg>
    </button>

    <button id="mode-toggle" class="icon-btn" type="button" aria-label="تبديل التدوير الحر 360 درجة" title="تدوير حر 360°">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-3-6.7"></path>
        <polyline points="21 3 21 9 15 9"></polyline>
      </svg>
    </button>

    <button id="theme-toggle" class="icon-btn" type="button" aria-label="تبديل خلفية الاستوديو" title="تبديل إضاءة الاستوديو">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </div>

  <script>
    (function () {
      'use strict';

      if (typeof THREE === 'undefined') return;

      function notifyParent(type, payload) {
        try {
          if (window.parent && window.parent !== window) {
            const targetOrigin = (window.location.origin && window.location.origin !== 'null')
              ? window.location.origin
              : window.location.href;
            window.parent.postMessage({type,detail:payload}, targetOrigin);
          }
        } catch (e) {}
      }

      window.choosePart = function (part) {
        notifyParent('nafas:plant-part-select', { part });
      };

      /* =========================================================
         1. ORCHID VARIETY PALETTES (Three.js r128)
         ========================================================= */
      const VARIETIES = {
        obsidian: {
          petalBase: '#87184e',
          petalMid: '#460726',
          petalEdge: '#1a020f',
          veinColor: '#12000a',
          veinHighlight: '#d14388',
          sepalBase: '#630d38',
          sepalEdge: '#14010b',
          lipThroat: '#f5b02c',
          lipMid: '#61062d',
          lipDeep: '#16000a',
          spotColor: '#0f0007',
          columnColor: '#f2cedf',
          trichomeColor: 0xffc66d,
          emissive: 0x52092d,
          lightAccent: 0xff6eb0
        },
        royal: {
          petalBase: '#d674b8',
          petalMid: '#7d155c',
          petalEdge: '#360427',
          veinColor: '#210117',
          veinHighlight: '#f5a3dc',
          sepalBase: '#b85399',
          sepalEdge: '#440732',
          lipThroat: '#f2a929',
          lipMid: '#5e073c',
          lipDeep: '#1e0113',
          spotColor: '#260118',
          columnColor: '#f5d2eb',
          trichomeColor: 0xffd27a,
          emissive: 0x4b0836,
          lightAccent: 0xe672cc
        },
        blush: {
          petalBase: '#fff2f7',
          petalMid: '#e69cbe',
          petalEdge: '#b5467a',
          veinColor: '#8c2255',
          veinHighlight: '#ffe0ee',
          sepalBase: '#fce8f0',
          sepalEdge: '#c45e90',
          lipThroat: '#f0ae30',
          lipMid: '#96164f',
          lipDeep: '#450522',
          spotColor: '#5e0730',
          columnColor: '#fff0eb',
          trichomeColor: 0xffcf75,
          emissive: 0x5c1636,
          lightAccent: 0xffa6cd
        },
        ivory: {
          petalBase: '#ffffff',
          petalMid: '#f7eff3',
          petalEdge: '#e6d3dd',
          veinColor: '#c9aebc',
          veinHighlight: '#ffffff',
          sepalBase: '#ffffff',
          sepalEdge: '#e8dce1',
          lipThroat: '#f2b028',
          lipMid: '#c45e1a',
          lipDeep: '#87123a',
          spotColor: '#91143c',
          columnColor: '#fffcf5',
          trichomeColor: 0xffc654,
          emissive: 0x423022,
          lightAccent: 0xffe0b0
        }
      };

      const state = {
        viewMode: 'exterior',
        variety: 'obsidian',
        darkStudio: false,
        freeOrbit: false,
        manualBloomOverride: false,
        processMix: 0,
        scrollTarget: 0,
        scrollCurrent: 0,
        scrollVelocity: 0,
        bloomCurrent: 0.46,
        bloomTarget: 0.46,
        pointerX: 0,
        pointerY: 0,
        smoothPointerX: 0,
        smoothPointerY: 0,
        orbitYaw: 0.1,
        orbitPitch: 0.1,
        orbitYawVel: 0,
        orbitPitchVel: 0,
        orbitDistance: 6.0,
        orbitDistanceTarget: 6.0,
        isDragging: false,
        lastDragX: 0,
        lastDragY: 0
      };

      /* =========================================================
         2. RENDERER, ULTRA-CLOSE MACRO CAMERA & STUDIO SOFTBOX
         ========================================================= */
      const container = document.getElementById('canvas-container');
      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(
        33,
        window.innerWidth / window.innerHeight,
        0.02,
        100
      );
      camera.position.set(0, 0.14, 6.0);

      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.24;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      function buildStudioEnvironment() {
        const pmrem = new THREE.PMREMGenerator(renderer);
        pmrem.compileEquirectangularShader();
        const envScene = new THREE.Scene();
        envScene.background = new THREE.Color(0xf6eaf0);

        const softboxGeo = new THREE.PlaneGeometry(14, 14);
        const panels = [
          { pos: [0, 10, 2], rot: [Math.PI / 2, 0, 0], col: 0xffffff },
          { pos: [10, 2, 4], rot: [0, -Math.PI / 2, 0], col: 0xffdceb },
          { pos: [-10, 3, -2], rot: [0, Math.PI / 2, 0], col: 0xe6ecff },
          { pos: [0, 4, -10], rot: [0, 0, 0], col: 0xffb8db },
          { pos: [0, -9, 3], rot: [-Math.PI / 2, 0, 0], col: 0xe8d0dc }
        ];
        panels.forEach((p) => {
          const m = new THREE.Mesh(
            softboxGeo,
            new THREE.MeshBasicMaterial({ color: p.col, side: THREE.DoubleSide })
          );
          m.position.set(p.pos[0], p.pos[1], p.pos[2]);
          m.rotation.set(p.rot[0], p.rot[1], p.rot[2]);
          envScene.add(m);
        });

        const envRT = pmrem.fromScene(envScene, 0.04);
        pmrem.dispose();
        return envRT.texture;
      }

      scene.environment = buildStudioEnvironment();

      /* =========================================================
         3. STUDIO + DYNAMIC MACRO RING-LIGHT + BIOLUMINESCENT RIG
         ========================================================= */
      const hemiLight = new THREE.HemisphereLight(0xfff7fa, 0xcba6ba, 0.95);
      scene.add(hemiLight);

      const keyLight = new THREE.DirectionalLight(0xfff6f0, 1.65);
      keyLight.position.set(4.8, 6.5, 5.8);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 1024;
      keyLight.shadow.mapSize.height = 1024;
      keyLight.shadow.camera.near = 1;
      keyLight.shadow.camera.far = 20;
      keyLight.shadow.camera.left = -4.2;
      keyLight.shadow.camera.right = 4.2;
      keyLight.shadow.camera.top = 4.2;
      keyLight.shadow.camera.bottom = -4.2;
      keyLight.shadow.bias = -0.0007;
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xeef2ff, 0.68);
      fillLight.position.set(-5.8, 1.6, 4.2);
      scene.add(fillLight);

      const rimLight = new THREE.SpotLight(0xff6eb0, 3.2, 24, Math.PI * 0.4, 0.78, 1.1);
      rimLight.position.set(-1.6, 3.8, -5.8);
      scene.add(rimLight);

      const rimLight2 = new THREE.SpotLight(0xffb8d9, 1.8, 20, Math.PI * 0.42, 0.8, 1.2);
      rimLight2.position.set(3.4, -1.8, -4.8);
      scene.add(rimLight2);

      const throatLight = new THREE.PointLight(0xffcb78, 1.25, 4.2, 2);
      throatLight.position.set(0, -0.02, 0.78);
      scene.add(throatLight);

      const macroRingLight = new THREE.PointLight(0xfff1f7, 0.0, 3.8, 1.8);
      scene.add(macroRingLight);

      const bioCoreLight = new THREE.PointLight(0x38f2c8, 0.0, 6.5, 1.6);
      bioCoreLight.position.set(0, -0.1, 0.1);
      scene.add(bioCoreLight);

      /* =========================================================
         4. MICROSCOPIC CELLULAR & VASCULAR TISSUE TEXTURES
         ========================================================= */
      function clamp01(v) {
        return Math.max(0, Math.min(1, v));
      }

      function createPetalTextures(palette, type) {
        const size = 768;

        const cColor = document.createElement('canvas');
        cColor.width = size;
        cColor.height = size;
        const ctx = cColor.getContext('2d');

        const baseGrad = ctx.createRadialGradient(
          size * 0.5, size * 0.96, size * 0.03,
          size * 0.5, size * 0.5, size * 0.78
        );
        if (type === 'petal') {
          baseGrad.addColorStop(0.0, palette.petalBase);
          baseGrad.addColorStop(0.28, palette.petalBase);
          baseGrad.addColorStop(0.66, palette.petalMid);
          baseGrad.addColorStop(1.0, palette.petalEdge);
        } else if (type === 'sepal') {
          baseGrad.addColorStop(0.0, palette.sepalBase);
          baseGrad.addColorStop(0.55, palette.petalMid);
          baseGrad.addColorStop(1.0, palette.sepalEdge);
        } else {
          baseGrad.addColorStop(0.0, palette.lipThroat);
          baseGrad.addColorStop(0.32, palette.lipThroat);
          baseGrad.addColorStop(0.62, palette.lipMid);
          baseGrad.addColorStop(1.0, palette.lipDeep);
        }
        ctx.fillStyle = baseGrad;
        ctx.fillRect(0, 0, size, size);

        if (type === 'petal' || type === 'sepal') {
          const edgeGlow = ctx.createRadialGradient(
            size * 0.5, size * 0.55, size * 0.34,
            size * 0.5, size * 0.52, size * 0.56
          );
          edgeGlow.addColorStop(0, palette.veinHighlight + '00');
          edgeGlow.addColorStop(0.82, palette.veinHighlight + '1a');
          edgeGlow.addColorStop(1, palette.veinHighlight + '3e');
          ctx.fillStyle = edgeGlow;
          ctx.fillRect(0, 0, size, size);
        }

        const cBump = document.createElement('canvas');
        cBump.width = size;
        cBump.height = size;
        const bCtx = cBump.getContext('2d');
        bCtx.fillStyle = '#747474';
        bCtx.fillRect(0, 0, size, size);

        const cellStep = 10;
        for (let row = 0; row < size / cellStep + 1; row++) {
          const cy = row * cellStep;
          const xOffset = (row % 2) * (cellStep * 0.5);
          for (let col = 0; col < size / cellStep + 1; col++) {
            const cx = col * cellStep + xOffset;
            bCtx.fillStyle = 'rgba(225, 225, 225, 0.24)';
            bCtx.beginPath();
            bCtx.arc(cx, cy, cellStep * 0.38, 0, Math.PI * 2);
            bCtx.fill();

            ctx.fillStyle = palette.veinHighlight;
            ctx.globalAlpha = 0.045;
            ctx.beginPath();
            ctx.arc(cx - 1, cy - 1, cellStep * 0.24, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.globalAlpha = 1.0;

        const cRough = document.createElement('canvas');
        cRough.width = size;
        cRough.height = size;
        const rCtx = cRough.getContext('2d');
        const rGrad = rCtx.createLinearGradient(0, size, 0, 0);
        rGrad.addColorStop(0.0, '#454545');
        rGrad.addColorStop(0.28, '#8a8a8a');
        rGrad.addColorStop(1.0, '#9c9c9c');
        rCtx.fillStyle = rGrad;
        rCtx.fillRect(0, 0, size, size);

        const cEmissive = document.createElement('canvas');
        cEmissive.width = size;
        cEmissive.height = size;
        const eCtx = cEmissive.getContext('2d');
        const eGrad = eCtx.createRadialGradient(size * 0.5, size * 0.9, size * 0.04, size * 0.5, size * 0.5, size * 0.65);
        eGrad.addColorStop(0.0, '#141414');
        eGrad.addColorStop(0.45, '#4c4c4c');
        eGrad.addColorStop(1.0, '#d8d8d8');
        eCtx.fillStyle = eGrad;
        eCtx.fillRect(0, 0, size, size);

        const veinCount = type === 'lip' ? 21 : 33;
        const veinCurves = [];
        for (let i = 0; i < veinCount; i++) {
          const t = (i / (veinCount - 1)) * 2 - 1;
          const p0 = { x: size * (0.5 + t * 0.14), y: size * 0.99 };
          const p1 = { x: size * (0.5 + t * 0.44), y: size * (0.64 - Math.abs(t) * 0.06) };
          const p2 = { x: size * (0.5 + t * 0.56), y: size * (0.28 + Math.abs(t) * 0.12) };
          const p3 = { x: size * (0.5 + t * 0.48), y: size * (0.03 + Math.abs(t) * 0.22) };
          veinCurves.push({ t, p0, p1, p2, p3 });

          ctx.beginPath();
          ctx.moveTo(p0.x, p0.y);
          ctx.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);
          ctx.strokeStyle = type === 'lip' ? palette.spotColor : palette.veinColor;
          ctx.globalAlpha = type === 'lip' ? 0.58 : (0.38 - Math.abs(t) * 0.15);
          ctx.lineWidth = type === 'lip' ? 3.2 : (2.6 - Math.abs(t) * 0.85);
          ctx.stroke();

          if (type !== 'lip') {
            ctx.beginPath();
            ctx.moveTo(p0.x + 1.8, p0.y);
            ctx.bezierCurveTo(p1.x + 1.8, p1.y, p2.x + 1.8, p2.y, p3.x + 1.8, p3.y);
            ctx.strokeStyle = palette.veinHighlight;
            ctx.globalAlpha = 0.22 - Math.abs(t) * 0.08;
            ctx.lineWidth = 1.25;
            ctx.stroke();
          }

          bCtx.beginPath();
          bCtx.moveTo(p0.x, p0.y);
          bCtx.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);
          bCtx.strokeStyle = '#ececec';
          bCtx.globalAlpha = 0.62;
          bCtx.lineWidth = 3.2;
          bCtx.stroke();

          eCtx.beginPath();
          eCtx.moveTo(p0.x, p0.y);
          eCtx.bezierCurveTo(p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);
          eCtx.strokeStyle = '#ffffff';
          eCtx.globalAlpha = 0.55;
          eCtx.lineWidth = 2.4;
          eCtx.stroke();
        }

        function sampleCubic(c, u) {
          const m = 1 - u;
          return {
            x: m * m * m * c.p0.x + 3 * m * m * u * c.p1.x + 3 * m * u * u * c.p2.x + u * u * u * c.p3.x,
            y: m * m * m * c.p0.y + 3 * m * m * u * c.p1.y + 3 * m * u * u * c.p2.y + u * u * u * c.p3.y
          };
        }
        let vSeed = 3137;
        const vRand = () => {
          vSeed = (vSeed * 16807) % 2147483647;
          return (vSeed - 1) / 2147483646;
        };
        for (let i = 0; i < veinCurves.length - 1; i++) {
          for (let step = 0; step < 9; step++) {
            const u1 = 0.14 + step * 0.09 + vRand() * 0.04;
            const u2 = clamp01(u1 + (vRand() - 0.5) * 0.07);
            const a = sampleCubic(veinCurves[i], u1);
            const b = sampleCubic(veinCurves[i + 1], u2);

            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.strokeStyle = palette.veinHighlight;
            ctx.globalAlpha = 0.13;
            ctx.lineWidth = 0.9;
            ctx.stroke();

            bCtx.beginPath();
            bCtx.moveTo(a.x, a.y);
            bCtx.lineTo(b.x, b.y);
            bCtx.strokeStyle = '#cccccc';
            bCtx.globalAlpha = 0.34;
            bCtx.lineWidth = 1.2;
            bCtx.stroke();

            eCtx.beginPath();
            eCtx.moveTo(a.x, a.y);
            eCtx.lineTo(b.x, b.y);
            eCtx.strokeStyle = '#ff99cc';
            eCtx.globalAlpha = 0.3;
            eCtx.lineWidth = 1.1;
            eCtx.stroke();
          }
        }
        ctx.globalAlpha = 1.0;
        bCtx.globalAlpha = 1.0;
        eCtx.globalAlpha = 1.0;

        if (type === 'lip') {
          let seed = 4217;
          const rand = () => {
            seed = (seed * 16807) % 2147483647;
            return (seed - 1) / 2147483646;
          };
          for (let s = 0; s < 170; s++) {
            const rx = (rand() - 0.5) * 0.72;
            const ry = 0.24 + rand() * 0.66;
            const px = size * (0.5 + rx);
            const py = size * ry;
            const rad = (2.8 + rand() * 9.5) * (1.1 - Math.abs(rx));
            ctx.beginPath();
            ctx.ellipse(px, py, rad * 0.72, rad * 1.28, rx * 0.75, 0, Math.PI * 2);
            ctx.fillStyle = palette.spotColor;
            ctx.globalAlpha = 0.4 + rand() * 0.48;
            ctx.fill();
          }
          ctx.globalAlpha = 1.0;
        } else {
          let seed = type === 'petal' ? 1091 : 2049;
          const rand = () => {
            seed = (seed * 16807) % 2147483647;
            return (seed - 1) / 2147483646;
          };
          for (let s = 0; s < 65; s++) {
            const rx = (rand() - 0.5) * 0.36;
            const ry = 0.7 + rand() * 0.26;
            ctx.beginPath();
            ctx.arc(size * (0.5 + rx), size * ry, 1.6 + rand() * 3.4, 0, Math.PI * 2);
            ctx.fillStyle = palette.veinColor;
            ctx.globalAlpha = 0.22 + rand() * 0.22;
            ctx.fill();
          }
          ctx.globalAlpha = 1.0;
        }

        const map = new THREE.CanvasTexture(cColor);
        map.encoding = THREE.sRGBEncoding;
        map.anisotropy = 8;

        const bumpMap = new THREE.CanvasTexture(cBump);
        bumpMap.anisotropy = 8;

        const roughnessMap = new THREE.CanvasTexture(cRough);
        const emissiveMap = new THREE.CanvasTexture(cEmissive);

        return { map, bumpMap, roughnessMap, emissiveMap };
      }

      /* =========================================================
         5. GPU MORPH-TARGET SCULPTED PETAL GEOMETRY
         ========================================================= */
      function evaluatePetalPoint(u, v, cfg, curlAmount) {
        let widthFactor;
        if (cfg.shape === 'wing') {
          const claw = Math.pow(v, 0.52);
          const roundTip = Math.pow(1 - Math.pow(v, 2.3), 0.55);
          widthFactor = claw * roundTip * 1.44;
        } else if (cfg.shape === 'sepal') {
          widthFactor = Math.sin(Math.pow(v, 0.72) * Math.PI) * (1.0 - 0.1 * v);
        } else if (cfg.shape === 'lipMid') {
          widthFactor = Math.sin(Math.pow(v, 0.65) * Math.PI) * (1.15 - 0.35 * v);
        } else {
          widthFactor = Math.sin(Math.pow(v, 0.6) * Math.PI) * 0.95;
        }

        const asym = cfg.asymmetry ? (1.0 + cfg.asymmetry * u * Math.sin(v * Math.PI)) : 1.0;
        const foldNarrow = 1.0 - curlAmount * 0.24 * Math.sin(v * Math.PI);
        const x = u * cfg.width * 0.5 * widthFactor * asym * foldNarrow;
        const y = v * cfg.length - Math.pow(Math.abs(u), 2.4) * (cfg.tipRound || 0.12) * Math.pow(v, 1.8);

        const budRoll = curlAmount * (Math.pow(v, 1.65) * 0.92 + (1 - u * u) * 0.36 * Math.sin(v * Math.PI));
        const bloomArch = (1 - curlAmount) * (Math.sin(v * Math.PI) * (cfg.arch || 0.24) - Math.pow(v, 2.4) * (cfg.tipCurl || 0.32));
        const cup = (1.0 - u * u) * ((cfg.cup || 0.18) + curlAmount * 0.32) * Math.sin(v * Math.PI);

        const edgeMask = Math.pow(Math.abs(u), 2.0) * Math.pow(v, 1.3) * (1.0 - curlAmount * 0.65);
        const ruffle = Math.sin(u * Math.PI * (cfg.ruffleFreq || 2.5) + (cfg.rufflePhase || 0)) * (cfg.ruffleAmp || 0.05) * edgeMask;

        const z = bloomArch + budRoll + cup + ruffle;
        return new THREE.Vector3(x, y, z);
      }

      function createMorphableOrchidGeometry(cfg) {
        const segU = cfg.segU || 46;
        const segV = cfg.segV || 50;
        const openPositions = [];
        const closedPositions = [];
        const uvs = [];
        const indices = [];

        for (let iv = 0; iv <= segV; iv++) {
          const v = iv / segV;
          for (let iu = 0; iu <= segU; iu++) {
            const u = (iu / segU) * 2 - 1;
            const pOpen = evaluatePetalPoint(u, v, cfg, 0.0);
            const pClosed = evaluatePetalPoint(u, v, cfg, 1.0);
            openPositions.push(pOpen.x, pOpen.y, pOpen.z);
            closedPositions.push(pClosed.x, pClosed.y, pClosed.z);
            uvs.push((u + 1) * 0.5, 1.0 - v);
          }
        }

        for (let iv = 0; iv < segV; iv++) {
          for (let iu = 0; iu < segU; iu++) {
            const a = iv * (segU + 1) + iu;
            const b = a + 1;
            const c = a + (segU + 1);
            const d = c + 1;
            indices.push(a, b, d);
            indices.push(a, d, c);
          }
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(openPositions, 3));
        geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
        geo.setIndex(indices);
        geo.morphAttributes.position = [
          new THREE.Float32BufferAttribute(closedPositions, 3)
        ];
        geo.computeVertexNormals();
        return geo;
      }

      /* =========================================================
         6. MATERIALS INITIALIZATION (With X-Ray Cutaway Support)
         ========================================================= */
      const materials = {};

      function initMaterials(varietyKey) {
        const pal = VARIETIES[varietyKey];
        const petalTex = createPetalTextures(pal, 'petal');
        const sepalTex = createPetalTextures(pal, 'sepal');
        const lipTex = createPetalTextures(pal, 'lip');

        materials.petal = new THREE.MeshPhysicalMaterial({
          map: petalTex.map,
          bumpMap: petalTex.bumpMap,
          bumpScale: 0.032,
          roughnessMap: petalTex.roughnessMap,
          emissive: new THREE.Color(pal.emissive),
          emissiveMap: petalTex.emissiveMap,
          emissiveIntensity: 0.28,
          roughness: 0.56,
          metalness: 0.0,
          clearcoat: 0.36,

          transparent: true,
          opacity: 1.0,
          side: THREE.DoubleSide
        });

        materials.sepal = new THREE.MeshPhysicalMaterial({

          roughnessMap: sepalTex.roughnessMap,
          emissive: new THREE.Color(pal.emissive),
          emissiveMap: sepalTex.emissiveMap,
          emissiveIntensity: 0.22,
          roughness: 0.6,
          metalness: 0.0,
          clearcoat: 0.28,
          clearcoatRoughness: 0.4,
          morphTargets: true,
          transparent: true,
          opacity: 1.0,
          side: THREE.DoubleSide
        });

        materials.lip = new THREE.MeshPhysicalMaterial({
          map: lipTex.map,
          bumpMap: lipTex.bumpMap,
          bumpScale: 0.034,
          emissive: new THREE.Color(pal.emissive),
          emissiveIntensity: 0.18,
          roughness: 0.32,
          metalness: 0.02,
          clearcoat: 0.5,
          clearcoatRoughness: 0.2,

          transparent: true,

        });

        materials.column = new THREE.MeshPhysicalMaterial({
          color: new THREE.Color(pal.columnColor),

        });

        materials.callus = new THREE.MeshPhysicalMaterial({

        });

        materials.trichome = new THREE.MeshPhysicalMaterial({
          color: new THREE.Color(pal.trichomeColor),

        });

        materials.pollen = new THREE.MeshPhysicalMaterial({
          color: 0xffd24c,

          clearcoat: 0.72
        });

        materials.stem = new THREE.MeshPhysicalMaterial({
          color: 0x29482e,

          clearcoat: 0.32,
          clearcoatRoughness: 0.32,

          opacity: 1.0
        });

        materials.leaf = new THREE.MeshPhysicalMaterial({
          color: 0x1e3b24,

        });

        materials.bud = new THREE.MeshPhysicalMaterial({

        });

        materials.dew = new THREE.MeshPhysicalMaterial({
          color: 0xffffff,
          roughness: 0.012,
          metalness: 0.04,
          clearcoat: 1.0,
          clearcoatRoughness: 0.012,

        });

        materials.sapVessel = new THREE.MeshBasicMaterial({
          color: 0x38f2c8,

        });

        materials.nectarCore = new THREE.MeshBasicMaterial({

      function updateVarietyMaterials(varietyKey) {
        const pal = VARIETIES[varietyKey];
        const petalTex = createPetalTextures(pal, 'petal');
        const sepalTex = createPetalTextures(pal, 'sepal');
        const lipTex = createPetalTextures(pal, 'lip');

        [
          [materials.petal, petalTex],
          [materials.sepal, sepalTex],
          [materials.lip, lipTex]
        ].forEach(([mat, tex]) => {
          if (mat.map) mat.map.dispose();
          if (mat.bumpMap) mat.bumpMap.dispose();
          if (mat.roughnessMap) mat.roughnessMap.dispose();
          if (mat.emissiveMap) mat.emissiveMap.dispose();
          mat.map = tex.map;
          mat.bumpMap = tex.bumpMap;
          mat.roughnessMap = tex.roughnessMap;
          mat.emissiveMap = tex.emissiveMap;
          mat.emissive.setHex(pal.emissive);
          mat.needsUpdate = true;
        });

        materials.column.color.set(pal.columnColor);
        materials.callus.color.set(pal.lipThroat);
        materials.trichome.color.setHex(pal.trichomeColor);
        materials.trichome.emissive.setHex(pal.emissive);
        materials.bud.color.set(pal.petalMid);
        rimLight.color.setHex(pal.lightAccent);
      }

      initMaterials(state.variety);

      /* =========================================================
         7. ARTICULATED ORCHID BLOSSOM + 3D MICRO-TISSUE ANATOMY
         ========================================================= */
      function createOrchidBlossom(scaleFactor, isHero) {
        const flowerGroup = new THREE.Group();
        flowerGroup.scale.setScalar(scaleFactor);
        const articulatedParts = [];
        const petalVascularCurves = [];

        function addPart(geo, mat, opts) {
          const holder = new THREE.Group();
          holder.rotation.z = opts.zAngle || 0;
          holder.position.set(opts.px || 0, opts.py || 0, opts.pz || 0);

          const hinge = new THREE.Group();
          const mesh = new THREE.Mesh(geo, mat);
          mesh.castShadow = true;
          mesh.receiveShadow = true;
          mesh.updateMorphTargets();
          hinge.add(mesh);

          if (isHero) {
            [-0.36, 0, 0.36].forEach((uLane) => {
              const pts = [];
              for (let step = 0; step <= 8; step++) {
                const v = 0.04 + (step / 8) * 0.86;
                const p = evaluatePetalPoint(uLane, v, opts.cfg, 0.0);
                pts.push(new THREE.Vector3(p.x, p.y, p.z + 0.008));
              }
              const vCurve = new THREE.CatmullRomCurve3(pts);
              const vTube = new THREE.Mesh(
                new THREE.TubeGeometry(vCurve, 18, 0.009, 6, false),
                materials.sapVessel
              );
              hinge.add(vTube);
              petalVascularCurves.push({ curve: vCurve, parent: hinge });
            });
          }

          const dewEntries = [];
          if (isHero && opts.dewCoords) {
            opts.dewCoords.forEach((dc) => {
              const drop = new THREE.Mesh(
                new THREE.SphereGeometry(dc.r, 20, 20),
                materials.dew
              );
              drop.scale.set(1.0, 1.08, 0.56);
              hinge.add(drop);
              dewEntries.push({
                mesh: drop,
                openPos: evaluatePetalPoint(dc.u, dc.v, opts.cfg, 0.0),
                closedPos: evaluatePetalPoint(dc.u, dc.v, opts.cfg, 1.0),
                r: dc.r
              });
            });
          }

          holder.add(hinge);
          flowerGroup.add(holder);

          articulatedParts.push({
            hinge,
            mesh,
            dewEntries,
            closedPitch: opts.closedPitch,
            openPitch: opts.openPitch,
            delay: opts.delay || 0,
            breezePhase: opts.breezePhase || 0,
            breezeAmp: opts.breezeAmp || 0.022
          });
        }

        const dorsalCfg = {
          shape: 'sepal',
          width: 1.4,
          length: 2.22,
          arch: 0.24,
          tipCurl: 0.36,
          cup: 0.2,
          ruffleAmp: 0.03,
          ruffleFreq: 2.0
        };
        addPart(createMorphableOrchidGeometry(dorsalCfg), materials.sepal, {
          cfg: dorsalCfg,
          zAngle: 0,
          pz: -0.14,
          closedPitch: 0.78,
          openPitch: -0.12,
          delay: 0.0,
          breezePhase: 0.4,
          breezeAmp: 0.018,
          dewCoords: [{ u: 0.18, v: 0.62, r: 0.042 }, { u: -0.12, v: 0.34, r: 0.024 }]
        });

        [-1, 1].forEach((side) => {
          const latSepCfg = {
            shape: 'sepal',
            width: 1.26,
            length: 2.15,
            arch: 0.22,
            tipCurl: 0.4,
            cup: 0.18,
            asymmetry: side * 0.16,
            ruffleAmp: 0.032
          };
          addPart(createMorphableOrchidGeometry(latSepCfg), materials.sepal, {
            cfg: latSepCfg,
            zAngle: side * 2.22,

      function createOrchidLeaf(length, width, arch) {
        const segU = 18;
        const segV = 28;
        const pos = [];
        const idx = [];
        for (let iv = 0; iv <= segV; iv++) {
          const v = iv / segV;
          const w = Math.sin(Math.pow(v, 0.62) * Math.PI) * width;
          for (let iu = 0; iu <= segU; iu++) {
            const u = (iu / segU) * 2 - 1;
            const x = u * w * 0.5;
            const y = v * length;
            const keel = Math.abs(u) * 0.14 * Math.sin(v * Math.PI);
            const z = Math.sin(v * Math.PI) * arch - Math.pow(v, 2.1) * (arch * 1.4) + keel;
            pos.push(x, y, z);
          }
        }
        for (let iv = 0; iv < segV; iv++) {
          for (let iu = 0; iu < segU; iu++) {
            const a = iv * (segU + 1) + iu;
            const b = a + 1;
            const c = a + (segU + 1);
            const d = c + 1;
            idx.push(a, b, d, a, d, c);
          }
        }
        const g = new THREE.BufferGeometry();
        g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
        g.setIndex(idx);
        g.computeVertexNormals();
        return g;
      }

        grad.addColorStop(1, 'rgba(0,0,0,0)');

        g.fillRect(0, 0, 64, 64);
        return new THREE.CanvasTexture(c);
      }

      /* =========================================================

         ========================================================= */
      function smootherstep(edge0, edge1, x) {
        const t = clamp01((x - edge0) / (edge1 - edge0));
        return t * t * t * (t * (t * 6 - 15) + 10);
      }

      const camPosSpline = new THREE.CatmullRomCurve3([
        new THREE.Vector3(-0.1, 0.14, 5.95),
        new THREE.Vector3(1.55, 0.48, 3.85),
        new THREE.Vector3(0.68, 0.22, 2.05),
        new THREE.Vector3(-0.08, 0.04, 1.38),
        new THREE.Vector3(0.32, 0.6, 6.85)
      ], false, 'catmullrom', 0.5);

      const camLookSpline = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0.0, 0.05, 0.0),
        new THREE.Vector3(0.35, 0.12, 0.15),
        new THREE.Vector3(0.28, 0.02, 0.22),
        new THREE.Vector3(0.0, -0.05, 0.38),
        new THREE.Vector3(0.24, 0.18, -0.15)
      ], false, 'catmullrom', 0.5);

      const tmpPos = new THREE.Vector3();
      const tmpLook = new THREE.Vector3();
      const currentLook = new THREE.Vector3(0, 0.05, 0);

      function applyLivingBloom(flowerObj, bloomAmount, timeSec) {
        flowerObj.articulatedParts.forEach((p) => {
          const localT = smootherstep(p.delay, Math.min(1.0, p.delay + 0.74), bloomAmount);
          const breeze = Math.sin(timeSec * 1.1 + p.breezePhase) * p.breezeAmp * (0.4 + localT * 0.6);

          p.hinge.rotation.x = THREE.MathUtils.lerp(p.closedPitch, p.openPitch, localT) + breeze;

          if (p.mesh && p.mesh.morphTargetInfluences) {
            const curlInfluence = clamp01((1.0 - localT) + Math.sin(timeSec * 0.85 + p.breezePhase) * 0.022);
            p.mesh.morphTargetInfluences[0] = curlInfluence;

            if (p.dewEntries.length) {
              p.dewEntries.forEach((d) => {
                d.mesh.position.lerpVectors(d.openPos, d.closedPos, curlInfluence);
                d.mesh.position.z += d.r * 0.42;
              });
            }
          }
        });
      }

      function setViewMode(mode) {
        state.viewMode = mode;

        btnExterior.classList.toggle('active', mode === 'exterior');
        btnInterior.classList.toggle('active', mode === 'interior');
        btnProcesses.classList.toggle('active', mode === 'processes');
        btnExterior.setAttribute('aria-selected', String(mode === 'exterior'));
        btnInterior.setAttribute('aria-selected', String(mode === 'interior'));
        btnProcesses.setAttribute('aria-selected', String(mode === 'processes'));

        processLegend.classList.toggle('visible', mode === 'processes');
        processLegend.setAttribute('aria-hidden', String(mode !== 'processes'));
        progressRail.classList.toggle('dimmed', mode !== 'exterior');
        macroToggle.classList.toggle('active', mode === 'interior');

        notifyParent('nafas:plant-part-select', { part: mode === 'processes' ? 'stem' : mode === 'interior' ? 'flower' : 'leaf' });

        if (mode === 'exterior') {
          state.freeOrbit = false;
          modeToggle.classList.remove('active');
          container.classList.remove('free-orbit');
          state.manualBloomOverride = false;
          updateScrollTarget();
        } else if (mode === 'interior') {
          state.freeOrbit = true;
          modeToggle.classList.add('active');
          container.classList.add('free-orbit');
          state.manualBloomOverride = true;
          state.bloomTarget = 0.98;
          bloomSlider.value = '98';
          state.orbitYaw = 0.06;
          state.orbitPitch = 0.02;
          state.orbitDistanceTarget = 1.26;
        } else if (mode === 'processes') {
          state.freeOrbit = true;
          modeToggle.classList.add('active');
          container.classList.add('free-orbit');
          state.manualBloomOverride = true;
          state.bloomTarget = 0.94;
          bloomSlider.value = '94';
          state.orbitYaw = 0.34;
          state.orbitPitch = 0.08;
          state.orbitDistanceTarget = 3.65;
          if (!state.darkStudio) {
            toggleStudioTheme(true);
          }
        }
      }

      btnExterior.addEventListener('click', () => setViewMode('exterior'));
      btnInterior.addEventListener('click', () => setViewMode('interior'));
      btnProcesses.addEventListener('click', () => setViewMode('processes'));

      function updateScrollTarget() {
        const maxScroll = Math.max(1, document.documentElement.scrollHeight - window.innerHeight);
        state.scrollTarget = clamp01(window.scrollY / maxScroll);

        if (!state.manualBloomOverride) {
          state.bloomTarget = 0.46 + Math.min(1, state.scrollTarget * 1.35) * 0.54;
          bloomSlider.value = String(Math.round(state.bloomTarget * 100));
        }

        const activeIdx = Math.min(4, Math.floor(state.scrollTarget * 4.5 + 0.2));
        chapterDots.forEach((dot, idx) => {
          dot.classList.toggle('active', idx === activeIdx);
        });
      }

      window.addEventListener('scroll', updateScrollTarget, { passive: true });
      updateScrollTarget();

      chapterDots.forEach((dot) => {
        dot.addEventListener('click', () => {
          const el = document.getElementById(dot.dataset.target);

          btn.classList.add('active');
          updateVarietyMaterials(v);

      function toggleStudioTheme(forceDark) {
        state.darkStudio = typeof forceDark === 'boolean' ? forceDark : !state.darkStudio;
        document.body.classList.toggle('dark-studio', state.darkStudio);

        renderer.toneMappingExposure = state.darkStudio ? 1.2 : 1.24;
      }

      themeToggle.addEventListener('click', () => toggleStudioTheme());

      window.addEventListener('pointermove', (e) => {
        state.pointerX = (e.clientX / window.innerWidth) * 2 - 1;
        state.pointerY = (e.clientY / window.innerHeight) * 2 - 1;
        if (state.isDragging) {
          const dx = e.clientX - state.lastDragX;
          const dy = e.clientY - state.lastDragY;
          state.lastDragX = e.clientX;
          state.lastDragY = e.clientY;
          const sensitivity = state.orbitDistance < 2.2 ? 0.0045 : 0.0075;
          state.orbitYawVel = dx * sensitivity;
          state.orbitPitchVel = dy * (sensitivity * 0.88);
          state.orbitYaw += state.orbitYawVel;
          state.orbitPitch = Math.max(-0.92, Math.min(0.92, state.orbitPitch + state.orbitPitchVel));
        }
      });

      container.addEventListener('pointerdown', (e) => {
        if (!state.freeOrbit) return;
        state.isDragging = true;
        state.lastDragX = e.clientX;
        state.lastDragY = e.clientY;
        state.orbitYawVel = 0;
        state.orbitPitchVel = 0;
        container.classList.add('dragging');
      });

      window.addEventListener('pointerup', () => {
        state.isDragging = false;
        container.classList.remove('dragging');
      });

      container.addEventListener('wheel', (e) => {
        if (!state.freeOrbit) return;
        const zoomSpeed = state.orbitDistanceTarget < 2.2 ? 0.0014 : 0.0032;
        state.orbitDistanceTarget = Math.max(0.92, Math.min(9.2, state.orbitDistanceTarget + e.deltaY * zoomSpeed));
      }, { passive: true });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      /* =========================================================
         12. ULTRA-SILKY RENDER LOOP + LIVE INTERNAL PROCESSES
         ========================================================= */
      let lastTime = performance.now();
      let elapsed = 0;
      const tmpSapPt = new THREE.Vector3();

      function damp(current, target, lambda, dt) {
        return THREE.MathUtils.lerp(current, target, 1 - Math.exp(-lambda * dt));
      }

      function animate(now) {
        requestAnimationFrame(animate);
        const dt = Math.min(0.05, Math.max(0.001, (now - lastTime) / 1000));
        lastTime = now;
        elapsed += dt;

        const prevScroll = state.scrollCurrent;
        state.scrollCurrent = damp(state.scrollCurrent, state.scrollTarget, 4.0, dt);
        state.scrollVelocity = damp(state.scrollVelocity, (state.scrollCurrent - prevScroll) / dt, 5.5, dt);

        state.bloomCurrent = damp(state.bloomCurrent, state.bloomTarget, 4.4, dt);
        state.smoothPointerX = damp(state.smoothPointerX, state.pointerX, 3.6, dt);
        state.smoothPointerY = damp(state.smoothPointerY, state.pointerY, 3.6, dt);

        const targetProcessMix = state.viewMode === 'processes' ? 1.0 : 0.0;
        state.processMix = damp(state.processMix, targetProcessMix, 4.5, dt);
        const pm = state.processMix;

        const pulse = 0.5 + 0.5 * Math.sin(elapsed * 2.8);
        materials.petal.opacity = THREE.MathUtils.lerp(1.0, 0.36, pm);
        materials.sepal.opacity = THREE.MathUtils.lerp(1.0, 0.32, pm);
        materials.lip.opacity = THREE.MathUtils.lerp(1.0, 0.62, pm);
        materials.column.opacity = THREE.MathUtils.lerp(1.0, 0.55, pm);
        materials.stem.opacity = THREE.MathUtils.lerp(1.0, 0.35, pm);

        materials.petal.emissiveIntensity = THREE.MathUtils.lerp(0.28, 0.95 + pulse * 0.45, pm);
        materials.sepal.emissiveIntensity = THREE.MathUtils.lerp(0.22, 0.8 + pulse * 0.35, pm);
        materials.pollen.emissiveIntensity = THREE.MathUtils.lerp(0.4, 1.8 + pulse * 1.1, pm);

        materials.sapVessel.opacity = pm * (0.55 + pulse * 0.28);
        materials.nectarCore.opacity = pm * (0.45 + pulse * 0.35);
        sapMat.opacity = pm * 0.92;
        veinPulseMat.opacity = pm * 0.95;
        pollenBioMat.opacity = pm * 0.88;
        bioCoreLight.intensity = pm * (1.8 + pulse * 0.9);

        if (heroOrchid.nectarChamberOrb) {
          const coreScale = 0.85 + pulse * 0.32;
          heroOrchid.nectarChamberOrb.scale.setScalar(coreScale);
        }

        if (pm > 0.01) {
          const sapAttr = sapGeo.attributes.position;
          for (let i = 0; i < sapCount; i++) {
            const u = (sapOffsets[i] + elapsed * 0.14) % 1.0;
            stemCurve.getPoint(u, tmpSapPt);
            sapAttr.setXYZ(
              i,
              tmpSapPt.x + Math.sin(elapsed * 3 + i) * 0.02,
              tmpSapPt.y,
              tmpSapPt.z + Math.cos(elapsed * 3 + i) * 0.02
            );
          }
          sapAttr.needsUpdate = true;

          veinPulseEntries.forEach((vp) => {
            const u = (vp.offset + elapsed * vp.speed) % 1.0;
            vp.curve.getPoint(u, vp.mesh.position);
            const s = Math.sin(u * Math.PI) * 1.25;
            vp.mesh.scale.setScalar(Math.max(0.01, s));
          });

          const pBioAttr = pollenBioGeo.attributes.position;
          for (let i = 0; i < pollenBioCount; i++) {
            const sd = pollenBioSeeds[i];
            const life = (sd.phase + elapsed * sd.speed) % 1.0;
            const r = sd.radius * (0.3 + life * 1.4);
            const ang = sd.angle + elapsed * 0.6;
            pBioAttr.setXYZ(
              i,
              Math.cos(ang) * r,
              -0.02 + life * 0.55,
              0.42 + Math.sin(ang) * r * 0.6 + life * 0.45
            );
          }
          pBioAttr.needsUpdate = true;
        }

        applyLivingBloom(heroOrchid, state.bloomCurrent, elapsed);
        applyLivingBloom(companionOrchid, clamp01(state.bloomCurrent * 0.84 + 0.16), elapsed + 0.9);

        buds.forEach((b, idx) => {
          const swell = 1.0 + state.bloomCurrent * 0.14 + Math.sin(elapsed * 1.2 + idx) * 0.015;
          b.mesh.scale.setScalar(b.baseScale * swell);
          b.mesh.rotation.z = b.baseRotZ + Math.sin(elapsed * 0.95 + idx * 1.4) * 0.035;
        });

        const breatheY = Math.sin(elapsed * 0.85) * 0.045;
        const breatheRotZ = Math.sin(elapsed * 0.7) * 0.018 + state.scrollVelocity * 0.045;
        orchidRoot.position.y = breatheY;

        if (state.freeOrbit) {
          if (!state.isDragging) {
            state.orbitYaw += state.orbitYawVel;
            state.orbitPitch = Math.max(-0.92, Math.min(0.92, state.orbitPitch + state.orbitPitchVel));
            const friction = Math.exp(-4.6 * dt);
            state.orbitYawVel *= friction;
            state.orbitPitchVel *= friction;
          }
          state.orbitDistance = damp(state.orbitDistance, state.orbitDistanceTarget, 5.8, dt);

          const deepFactor = smootherstep(3.0, 1.15, state.orbitDistance);
          const focusZ = THREE.MathUtils.lerp(0.0, 0.42, deepFactor);
          const focusY = THREE.MathUtils.lerp(0.1, -0.04, deepFactor);

          const cx = Math.sin(state.orbitYaw) * Math.cos(state.orbitPitch) * state.orbitDistance;
          const cy = Math.sin(state.orbitPitch) * state.orbitDistance + focusY;
          const cz = Math.cos(state.orbitYaw) * Math.cos(state.orbitPitch) * state.orbitDistance + focusZ;
          tmpPos.set(cx, cy, cz);
          tmpLook.set(0.0, focusY, focusZ);

          camera.position.lerp(tmpPos, 1 - Math.exp(-7.2 * dt));
          currentLook.lerp(tmpLook, 1 - Math.exp(-7.2 * dt));
          camera.lookAt(currentLook);

          orchidRoot.rotation.y = damp(orchidRoot.rotation.y, 0, 4.5, dt);
          orchidRoot.rotation.x = damp(orchidRoot.rotation.x, 0, 4.5, dt);
          orchidRoot.rotation.z = damp(orchidRoot.rotation.z, breatheRotZ * (1 - deepFactor * 0.65), 5.0, dt);
        } else {
          const isMobile = window.innerWidth <= 768;
          const mobileZoom = isMobile ? 1.2 : 1.0;

          camPosSpline.getPoint(state.scrollCurrent, tmpPos);
          camLookSpline.getPoint(state.scrollCurrent, tmpLook);
          tmpPos.x *= isMobile ? 0.55 : 1.0;
          tmpPos.z *= mobileZoom;

          camera.position.lerp(tmpPos, 1 - Math.exp(-5.0 * dt));
          currentLook.lerp(tmpLook, 1 - Math.exp(-5.0 * dt));
          camera.lookAt(currentLook);

          const camDist = camera.position.distanceTo(currentLook);
          const macroCalm = smootherstep(1.0, 3.2, camDist);

          const desiredRotY = Math.sin(state.scrollCurrent * Math.PI * 1.4) * 0.2 * macroCalm + state.smoothPointerX * (0.06 + 0.12 * macroCalm);
          const desiredRotX = Math.cos(state.scrollCurrent * Math.PI) * 0.05 * macroCalm + state.smoothPointerY * (0.04 + 0.06 * macroCalm);
          orchidRoot.rotation.y = damp(orchidRoot.rotation.y, desiredRotY, 4.0, dt);
          orchidRoot.rotation.x = damp(orchidRoot.rotation.x, desiredRotX, 4.0, dt);
          orchidRoot.rotation.z = damp(orchidRoot.rotation.z, breatheRotZ * (0.35 + 0.65 * macroCalm), 4.5, dt);
        }

        const distToHeart = camera.position.distanceTo(currentLook);
        const macroIntensity = smootherstep(3.4, 1.1, distToHeart) * 1.45;
        macroRingLight.intensity = damp(macroRingLight.intensity, macroIntensity, 6.0, dt);
        macroRingLight.position.copy(camera.position);

        particles.rotation.y = elapsed * 0.018;
        particles.position.y = Math.sin(elapsed * 0.35) * 0.14;

        renderer.render(scene, camera);
      }

      requestAnimationFrame(animate);
    })();
  </script>
</body>
