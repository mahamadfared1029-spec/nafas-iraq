name: NAFAS Security & CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret Detection & Push Protection (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  test-and-build:
    name: Automated Tests & Type Verification
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Pre-Commit Secret Scanner Check
        run: npm run secret-scan

      - name: Run Vitest Test Suite
        run: npm run test

      - name: Verify Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://ucaavthzcmobobilbmqu.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy_anon_key_for_build_check_only_32chars"
